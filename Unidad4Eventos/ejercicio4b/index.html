<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio4b</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>

<body>
    <h1>THE GREAT</h1>
    <P id="rgbtitulo"></P>
    <h2>GUESSING GAME</h2>
    <div class="divs" style="display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-gap: 10px;
        grid-auto-rows: minmax(100px, auto);">
        <div style="background-color: red;" id="div1">
            
        </div>
        <div style="background-color: blue;" id="div2">
            
        </div>
        <div style="background-color: green;" id="div3">
            
        </div>
        
    </div><br><br>
    <div style="display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-gap: 10px;
        grid-auto-rows: minmax(100px, auto);">
        <div style="background-color: red;" id="div4">
            
        </div>
        <div style="background-color: blue;" id="div5">
            
        </div>
        <div style="background-color: green;" id="div6">
            
        </div>
        <br><span id="resultadoRgb"></span>
    </div>
    <br>
    <div id="calculadora" class="calculator">
        
        <input id="pantalla" type="text" class="display" >

        
        <div class="grid">
            
            
            <button id="btnSuma" class="btn btn-op">+</button>
            <button id="btnResta" class="btn btn-op">-</button>
            <button id="btnPor" class="btn btn-op">×</button>
            <button id="btnDiv" class="btn btn-op">÷</button>

            
            <button id="btn7" class="btn">7</button>
            <button id="btn8" class="btn">8</button>
            <button id="btn9" class="btn">9</button>
            
            
            <button id="btnResultado" class="btn btn-equal">=</button>

            
            <button id="btn4" class="btn">4</button>
            <button id="btn5" class="btn">5</button>
            <button id="btn6" class="btn">6</button>

            
            <button id="btn1" class="btn">1</button>
            <button id="btn2" class="btn">2</button>
            <button id="btn3" class="btn">3</button>

            
            <button id="btn0" class="btn">0</button>
            <button id="btnPunto" class="btn">.</button>
            <button id="btnLimpiar" class="btn">C</button>
            
        </div>
    </div>
</body>
